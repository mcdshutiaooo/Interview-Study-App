<section class="session-layout">
  <div class="session-main">
    <div class="session-progress">
      <div class="bar"><span [style.width.%]="sessionProgress"></span></div>
    </div>

    <app-question-panel [question]="currentQuestion" (statusChange)="markQuestion($event)" />

    <div class="keyboard-hint">
      <span></span>
      <strong>Press</strong>
      <kbd>Space</kbd>
      <strong>to reveal</strong>
      <span></span>
    </div>
  </div>

  <aside class="session-side">
    <app-stats-card label="Question" [value]="currentIndex() + 1 + ' / ' + sessionQuestions().length" helper="Current round" />
    <app-stats-card label="Time left" [value]="minutesLeft + ' min'" helper="20-minute session" />
    <app-stats-card label="Needs review" value="3 items" helper="Weakest first later" />
  </aside>
</section>
