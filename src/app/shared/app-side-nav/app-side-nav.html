<aside class="side-nav">
  <a class="brand" routerLink="/dashboard" aria-label="PrepSteady dashboard">
    <strong>PrepSteady</strong>
    <span>Serene Professionalism</span>
  </a>
  <nav aria-label="Primary">
    @for (item of items; track item.route) {
      <a [routerLink]="item.route" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }">
        <span aria-hidden="true">{{ item.icon }}</span>
        {{ item.label }}
      </a>
    }
  </nav>
  <div class="profile-card">
    <div class="avatar">AC</div>
    <div>
      <strong>Alex Chen</strong>
      <span>Premium member</span>
    </div>
  </div>
</aside>
