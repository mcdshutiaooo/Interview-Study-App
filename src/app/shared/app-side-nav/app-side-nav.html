<aside class="side-nav">
  <a class="brand" routerLink="/dashboard" aria-label="Interview Companion dashboard">
    <span class="brand-mark" aria-hidden="true">♡</span>
    <strong>Interview<br />Companion</strong>
  </a>
  <nav aria-label="Primary">
    @for (item of items; track item.route) {
      <a [routerLink]="item.route" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }">
        <span aria-hidden="true">{{ item.icon }}</span>
        {{ item.label }}
      </a>
    }
  </nav>
  <div class="side-note">
    <span aria-hidden="true">♡</span>
    <p>“Small steps every day lead to a confident you.”</p>
  </div>
</aside>
